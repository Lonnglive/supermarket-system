services:
  postgres:
    image: postgres:16-alpine
    container_name: aeropos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-supermarket_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres123}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - aeropos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-supermarket_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aeropos-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-supermarket_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres123}
      JWT_SECRET: ${JWT_SECRET:-aeropos_supermarket_jwt_secret_key_change_in_production_2026_xyz}
      JWT_EXPIRES_IN: 12h
      DAILY_REPORT_ENABLED: "true"
      DAILY_REPORT_CRON: "0 23 * * *"
    ports:
      - "5000:5000"

volumes:
  aeropos_pgdata:
    driver: local
